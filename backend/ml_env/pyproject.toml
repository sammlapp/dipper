# Experimental: uv-managed ML environment, replacing dipper_ml_env.yml + conda-pack.
# Mirrors the `pip:` section of backend/dipper_ml_env.yml.
[project]
name = "dipper-ml-env"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    # General app and IO framework
    "pyyaml>=6.0",
    "h5py>=3.0.0",
    "psutil>=5.8.0",
    # v82 removed pkg_resources required by tf
    # see https://github.com/pypa/setuptools/issues/5174
    "setuptools<82.0.0",

    # HTTP and networking
    "aiohttp>=3.8.0",
    "aiohttp-cors>=0.7.0",

    # Bioacoustics libraries
    "opensoundscape==0.13.2",
    "bioacoustics-model-zoo==0.13.2",

    # BMZ dependencies for extended model support
    "timm>=1.0.0",          # HawkEars
    "opencv-python",        # HawkEars
    "ai-edge-litert",       # BirdNET (.tflite)
    "transformers",         # BirdSET
    "tensorflow>=2.20.0",   # Perch and Perch v2
    "kagglehub",            # Perch and Perch v2
]

# The torch variant is chosen at install time:  uv sync --frozen --extra cpu|cuda
# Both are locked. PyPI's default torch is CPU-only on Windows and CUDA 13.2 on
# Linux, so the PyTorch index is used explicitly for both variants. macOS always
# uses PyPI (CPU + MPS) and ignores the extras.
[project.optional-dependencies]
cpu = ["torch", "torchvision", "torchaudio"]
cuda = ["torch", "torchvision", "torchaudio"]

[tool.uv]
package = false
# 2.14.1 is the newest torch published on both the cpu and cu126 indexes.
constraint-dependencies = ["torch==2.14.1"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
