name: Release Conda-Pack Environment

# Use this when build-conda-env.yml succeeded but the HF upload step failed,
# or when you want to re-release artifacts from a previous build run.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the build-conda-env.yml workflow that produced the artifacts'
        required: true

jobs:
  release:
    name: Upload Conda Environment Artifacts to Hugging Face
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-env-macos-arm64
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/conda-env-macos-arm64/
        continue-on-error: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-env-windows-x64
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/conda-env-windows-x64/
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-env-linux-x64
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/conda-env-linux-x64/
        continue-on-error: true

      - name: Show downloaded artifacts
        run: find artifacts/ -type f | sort

      - name: Upload all envs to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os, sys
          from huggingface_hub import HfApi

          api = HfApi()
          uploads = [
              ("artifacts/conda-env-macos-arm64/dipper_ml_env-macos-arm64.tar.gz", "dipper_ml_env-macos-arm64.tar.gz"),
              ("artifacts/conda-env-windows-x64/dipper_ml_env-windows-x64.tar.gz", "dipper_ml_env-windows-x64.tar.gz"),
              ("artifacts/conda-env-linux-x64/dipper_ml_env-linux-x64.tar.gz", "dipper_ml_env-linux-x64.tar.gz"),
          ]

          any_uploaded = False
          for src, dest in uploads:
              if not os.path.exists(src):
                  print(f"[SKIP] {src} not found")
                  continue
              print(f"[INFO] Uploading {src} → {dest}")
              api.upload_file(
                  path_or_fileobj=src,
                  path_in_repo=dest,
                  repo_id="sammlapp/dipper-envs",
                  repo_type="dataset",
                  token=os.environ["HF_TOKEN"],
              )
              print(f"[OK] Uploaded {dest}")
              any_uploaded = True

          if not any_uploaded:
              print("[ERROR] No artifacts were uploaded")
              sys.exit(1)
          EOF
