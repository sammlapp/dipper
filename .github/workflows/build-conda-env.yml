name: Build Conda-Pack Environment

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g. "rc1"). Leave blank to use timestamp.'
        required: false
        default: ''

jobs:
  build-conda-pack:
    name: Build Conda-Pack Environment - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            artifact_name: conda-env-macos-arm64
            asset_name: dipper_ml_env-macos-arm64.tar.gz
            hf_path: dipper_ml_env-macos-arm64.tar.gz
          - platform: windows-x64
            os: windows-latest
            artifact_name: conda-env-windows-x64
            asset_name: dipper_ml_env-windows-x64.tar.gz
            hf_path: dipper_ml_env-windows-x64.tar.gz
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: conda-env-linux-x64
            asset_name: dipper_ml_env-linux-x64.tar.gz
            hf_path: dipper_ml_env-linux-x64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          miniforge-version: latest

      - name: Build conda-pack environment
        shell: bash -el {0}
        run: |
          cd backend
          python build_conda_pack.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify conda-pack archive
        shell: bash
        run: |
          if [ -f "environments/dipper_ml_env.tar.gz" ]; then
            echo "[SUCCESS] Conda-pack environment built successfully"
            ls -lh environments/dipper_ml_env.tar.gz
          else
            echo "[ERROR] Conda-pack environment not found"
            exit 1
          fi

      - name: Rename archive with platform suffix
        shell: bash
        run: |
          mv environments/dipper_ml_env.tar.gz environments/${{ matrix.asset_name }}
          ls -lh environments/${{ matrix.asset_name }}

      - name: Upload conda-pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: environments/${{ matrix.asset_name }}
          retention-days: 90

      - name: Upload env to Hugging Face
        shell: bash -el {0}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os, sys
          from huggingface_hub import HfApi

          src = "environments/${{ matrix.asset_name }}"
          if not os.path.exists(src):
              print(f"[ERROR] Artifact not found at {src}")
              sys.exit(1)

          api = HfApi()
          api.upload_file(
              path_or_fileobj=src,
              path_in_repo="${{ matrix.hf_path }}",
              repo_id="sammlapp/dipper-envs",
              repo_type="dataset",
              token=os.environ["HF_TOKEN"],
          )
          print("Upload to Hugging Face complete: ${{ matrix.hf_path }}")
          EOF
