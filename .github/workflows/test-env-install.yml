name: Test ML Environment Install

on:
  workflow_dispatch:

jobs:
  test-env-install:
    name: Test env install - ${{ matrix.os }} - ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # CI runners have no GPU: cuda checks that the CUDA build installs and imports.
        include:
          - {os: macos-latest, variant: cpu}
          - {os: windows-latest, variant: cpu}
          - {os: windows-latest, variant: cuda}
          - {os: ubuntu-22.04, variant: cpu}
          - {os: ubuntu-22.04, variant: cuda}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      # Runs app.py's install_environment / check_environment with
      # PYTHONHOME/PYTHONPATH set to a nonexistent directory.
      - name: Test environment install
        working-directory: backend
        env:
          TORCH_VARIANT: ${{ matrix.variant }}
        run: uv run --frozen python -m unittest tests.test_env_install -v
