name: Test ML Environment Install

on:
  workflow_dispatch:

jobs:
  test-env-install:
    name: Test env install - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements-backend.txt

      # Runs app.py's download_environment / extract_environment / check_environment
      # with PYTHONHOME/PYTHONPATH set to a nonexistent directory.
      - name: Test environment install
        working-directory: backend
        run: python -m unittest tests.test_env_install -v
